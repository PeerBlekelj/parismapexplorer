<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- page-meta: vite.config.ts rewrites this block for each /place/ page -->
    <title>Paris 1550 · the Truschet &amp; Hoyau map and the city today</title>
    <meta name="description" content="Every place named on the Truschet &amp; Hoyau plan of Paris, c. 1550, found on the map and in the city today." />
    <link rel="canonical" href="%SITE%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paris 1550" />
    <meta property="og:title" content="Paris 1550 · the Truschet &amp; Hoyau map and the city today" />
    <meta property="og:description" content="Every place named on the Truschet &amp; Hoyau plan of Paris, c. 1550, found on the map and in the city today." />
    <meta property="og:url" content="%SITE%/" />
    <meta property="og:image" content="%SITE%/og/site.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="420" />
    <meta property="og:image:alt" content="The Île de la Cité and both banks on the Truschet &amp; Hoyau plan of Paris" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /page-meta -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="app" data-view="map">
      <aside class="side">
        <div class="top">
          <a class="brand" id="brand" href="/"><span id="brand-title"></span><small id="brand-sub"></small></a>
          <div class="toolrow">
            <div class="search">
              <label class="q-wrap">
                <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <input id="q" type="search" autocomplete="off" spellcheck="false" />
              </label>
              <button type="button" id="q-clear" class="q-clear" hidden>×</button>
              <button type="button" id="filters-btn" class="filters-btn" aria-expanded="false" aria-controls="filters"></button>
            </div>
            <div class="viewtabs" role="tablist">
              <button type="button" data-view="map" class="on" role="tab" aria-selected="true"></button>
              <button type="button" data-view="table" role="tab" aria-selected="false"></button>
            </div>
          </div>
          <div class="filters" id="filters" hidden><div class="chips" id="chips"></div></div>
        </div>
        <div class="count" id="count"></div>
        <div class="list" id="list" role="listbox"></div>
        <div class="card-wrap" id="card"></div>
        <footer class="credits" id="credits"></footer>
      </aside>
      <main class="main">
        <div class="map-area" data-mode="side" id="map-area">
          <div class="modes" id="modes">
            <button type="button" data-m="side" class="on"></button>
            <button type="button" data-m="overlay"></button>
            <button type="button" data-m="old"></button>
            <button type="button" data-m="mod"></button>
          </div>
          <button type="button" class="orient" id="orient" aria-pressed="false"><span class="box" aria-hidden="true"></span><span class="lbl"></span></button>
          <div class="warn" id="warn"></div>
          <div class="panes">
            <div class="pane oldp"><div class="map" id="map-old"></div><span class="tag" id="tag-old"></span></div>
            <div class="pane modp">
              <div class="map" id="map-mod"></div>
              <div class="map ovl" id="map-ovl"></div>
              <div class="swipe" id="swipe"><span class="swipe-l"></span><span class="swipe-r"></span></div>
              <span class="tag" id="tag-mod"></span>
            </div>
          </div>
          <div class="ctrl" id="ctrl">
            <label><span id="op-label"></span> <input type="range" id="op" min="0" max="100" value="80" /> <span id="op-unit"></span></label>
            <span class="muted" id="swipe-hint"></span>
          </div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <div class="table-view" id="table"></div>
      </main>
    </div>
    <div class="tooltip" id="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
