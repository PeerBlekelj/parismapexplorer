<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The Truschet & Hoyau plan of Paris, c. 1550, side by side with the city today." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Paris Map Explorer: Paris in 1550</title>
  </head>
  <body>
    <div class="app" data-view="map">
      <aside class="side">
        <div class="top">
          <div class="brand"><span id="brand-title"></span><small id="brand-sub"></small></div>
          <div class="viewtabs" role="tablist">
            <button type="button" data-view="map" class="on" role="tab" aria-selected="true"></button>
            <button type="button" data-view="table" role="tab" aria-selected="false"></button>
          </div>
          <label class="search">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false" />
            <button type="button" id="q-clear" class="q-clear" hidden>×</button>
          </label>
          <div class="chips" id="chips"></div>
        </div>
        <div class="count" id="count"></div>
        <div class="list" id="list" role="listbox"></div>
        <div class="card-wrap" id="card"></div>
        <footer class="credits" id="credits"></footer>
      </aside>
      <main class="main">
        <div class="map-area" data-mode="side" id="map-area">
          <div class="modes" id="modes">
            <button type="button" data-m="side" class="on"></button>
            <button type="button" data-m="overlay"></button>
            <button type="button" data-m="old"></button>
            <button type="button" data-m="mod"></button>
          </div>
          <button type="button" class="orient" id="orient" aria-pressed="false"><span class="box" aria-hidden="true"></span><span class="lbl"></span></button>
          <div class="warn" id="warn"></div>
          <div class="panes">
            <div class="pane oldp"><div class="map" id="map-old"></div><span class="tag" id="tag-old"></span></div>
            <div class="pane modp">
              <div class="map" id="map-mod"></div>
              <div class="map ovl" id="map-ovl"></div>
              <div class="swipe" id="swipe"><span class="swipe-l"></span><span class="swipe-r"></span></div>
              <span class="tag" id="tag-mod"></span>
            </div>
          </div>
          <div class="ctrl" id="ctrl">
            <label><span id="op-label"></span> <input type="range" id="op" min="0" max="100" value="80" /> <span id="op-unit"></span></label>
            <span class="muted" id="swipe-hint"></span>
          </div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <div class="table-view" id="table"></div>
      </main>
    </div>
    <div class="tooltip" id="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
